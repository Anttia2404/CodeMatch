name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: java -version
      - run: ./mvnw -version
      - name: Diagnose Docker for Testcontainers
        shell: bash
        run: |
          set -euxo pipefail
          docker version
          docker info
          docker ps
          if [ -S /var/run/docker.sock ]; then
            stat /var/run/docker.sock
          else
            echo 'Docker socket /var/run/docker.sock is unavailable'
            exit 1
          fi
          for name in DOCKER_HOST DOCKER_CONTEXT DOCKER_TLS_VERIFY DOCKER_CERT_PATH TESTCONTAINERS_HOST_OVERRIDE TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE; do
            if printenv "$name" >/dev/null; then
              printf '%s=%s\n' "$name" "$(printenv "$name")"
            else
              printf '%s=<unset>\n' "$name"
            fi
          done
      - run: ./mvnw -B compile
      - run: ./mvnw -B test
      - run: ./mvnw -B verify
