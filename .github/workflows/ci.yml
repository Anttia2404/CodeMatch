name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Start isolated real E2E services
        env:
          COMPOSE_PROJECT_NAME: codematch-e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker compose -f docker-compose.e2e.yml up -d --build --wait
      - name: Run browser tests against real backend
        env:
          CODEMATCH_REAL_E2E: '1'
          VITE_API_BASE_URL: http://127.0.0.1:18080/api/v1
        run: npm run test:e2e
      - name: Collect real E2E service logs
        if: failure()
        env:
          COMPOSE_PROJECT_NAME: codematch-e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker compose -f docker-compose.e2e.yml logs --no-color
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-real-e2e-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
      - name: Stop isolated E2E services
        if: always()
        env:
          COMPOSE_PROJECT_NAME: codematch-e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker compose -f docker-compose.e2e.yml down --volumes --remove-orphans
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: java -version
      - run: ./mvnw -version
      - name: Diagnose Docker for Testcontainers
        shell: bash
        run: |
          set -euxo pipefail
          docker version
          docker info
          docker ps
          if [ -S /var/run/docker.sock ]; then
            stat /var/run/docker.sock
          else
            echo 'Docker socket /var/run/docker.sock is unavailable'
            exit 1
          fi
          for name in DOCKER_HOST DOCKER_CONTEXT DOCKER_TLS_VERIFY DOCKER_CERT_PATH TESTCONTAINERS_HOST_OVERRIDE TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE; do
            if printenv "$name" >/dev/null; then
              printf '%s=%s\n' "$name" "$(printenv "$name")"
            else
              printf '%s=<unset>\n' "$name"
            fi
          done
      - run: ./mvnw -B compile
      - run: ./mvnw -B test
      - run: ./mvnw -B verify
