spring:
  application:
    name: codematch-api
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/codematch}
    username: ${SPRING_DATASOURCE_USERNAME:codematch}
    password: ${SPRING_DATASOURCE_PASSWORD:local-dev-only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  session:
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
logging:
  level:
    root: WARN
codematch:
  cv:
    storage-dir: ${java.io.tmpdir}/codematch-test-private-cvs
  cookie:
    secure: false
  cors:
    allowed-origin: http://localhost:5173
  rate-limit:
    enabled: true
    login:
      limit: 1000
      window-seconds: 60
    registration:
      limit: 1000
      window-seconds: 60
    proposal:
      limit: 1000
      window-seconds: 60
    cv-download:
      limit: 1000
      window-seconds: 60
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        name: CMSESSION
        http-only: true
        secure: false
        same-site: lax
        path: /
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
