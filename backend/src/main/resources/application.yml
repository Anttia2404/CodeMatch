spring:
  application:
    name: codematch-api
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/codematch}
    username: ${SPRING_DATASOURCE_USERNAME:codematch}
    password: ${SPRING_DATASOURCE_PASSWORD:local-dev-only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
logging:
  level:
    root: INFO
codematch:
  cors:
    allowed-origin: ${CODEMATCH_CORS_ALLOWED_ORIGIN:http://localhost:5173}
server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
