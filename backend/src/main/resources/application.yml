spring:
  application:
    name: codematch-api
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/codematch}
    username: ${SPRING_DATASOURCE_USERNAME:codematch}
    password: ${SPRING_DATASOURCE_PASSWORD:local-dev-only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  session:
    jdbc:
      initialize-schema: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
logging:
  level:
    root: INFO
codematch:
  cookie:
    secure: ${CODEMATCH_COOKIE_SECURE:false}
  cors:
    allowed-origin: ${CODEMATCH_CORS_ALLOWED_ORIGIN:http://localhost:5173}
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        name: CMSESSION
        http-only: true
        secure: ${CODEMATCH_COOKIE_SECURE:false}
        same-site: lax
        path: /
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
