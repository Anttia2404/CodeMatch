spring:
  application:
    name: codematch-api
  lifecycle:
    timeout-per-shutdown-phase: 20s
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/codematch}
    username: ${SPRING_DATASOURCE_USERNAME:codematch}
    password: ${SPRING_DATASOURCE_PASSWORD:local-dev-only}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_MINIMUM_IDLE:2}
      connection-timeout: ${SPRING_DATASOURCE_CONNECTION_TIMEOUT_MS:30000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  session:
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
logging:
  level:
    root: INFO
  structured:
    format:
      console: logstash
  pattern:
    level: "%5p request_id=%X{correlationId:-}"
codematch:
  cv:
    storage-dir: ${CODEMATCH_CV_STORAGE_DIR:${user.home}/.codematch/private-cvs}
  cookie:
    secure: ${CODEMATCH_COOKIE_SECURE:false}
  cors:
    allowed-origin: ${CODEMATCH_CORS_ALLOWED_ORIGIN:http://localhost:5173}
  rate-limit:
    enabled: ${CODEMATCH_RATE_LIMIT_ENABLED:true}
    login:
      limit: ${CODEMATCH_LOGIN_RATE_LIMIT:12}
      window-seconds: ${CODEMATCH_LOGIN_RATE_WINDOW_SECONDS:900}
    registration:
      limit: ${CODEMATCH_REGISTRATION_RATE_LIMIT:20}
      window-seconds: ${CODEMATCH_REGISTRATION_RATE_WINDOW_SECONDS:3600}
    proposal:
      limit: ${CODEMATCH_PROPOSAL_RATE_LIMIT:8}
      window-seconds: ${CODEMATCH_PROPOSAL_RATE_WINDOW_SECONDS:60}
    cv-download:
      limit: ${CODEMATCH_CV_DOWNLOAD_RATE_LIMIT:30}
      window-seconds: ${CODEMATCH_CV_DOWNLOAD_RATE_WINDOW_SECONDS:60}
    report:
      limit: ${CODEMATCH_REPORT_RATE_LIMIT:5}
      window-seconds: ${CODEMATCH_REPORT_RATE_WINDOW_SECONDS:3600}
server:
  shutdown: graceful
  forward-headers-strategy: framework
  tomcat:
    mbeanregistry:
      enabled: true
  servlet:
    session:
      timeout: 30m
      cookie:
        name: CMSESSION
        http-only: true
        secure: ${CODEMATCH_COOKIE_SECURE:false}
        same-site: lax
        path: /
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
