name: codematch-staging

services:
  postgres:
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the approved staging environment file}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the approved staging environment file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Inject POSTGRES_PASSWORD from the approved secret manager}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Inject POSTGRES_PASSWORD from the approved secret manager}
      SPRING_DATASOURCE_MAXIMUM_POOL_SIZE: ${SPRING_DATASOURCE_MAXIMUM_POOL_SIZE:-8}
      CODEMATCH_CORS_ALLOWED_ORIGIN: https://${CODEMATCH_DOMAIN:?Set CODEMATCH_DOMAIN}
      CODEMATCH_COOKIE_SECURE: "true"
      CODEMATCH_CV_STORAGE_DIR: /var/lib/codematch/private-cvs
    volumes:
      - private_cvs:/var/lib/codematch/private-cvs
    networks:
      - edge
      - data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: Dockerfile.staging-web
    restart: unless-stopped
    environment:
      CODEMATCH_DOMAIN: ${CODEMATCH_DOMAIN:?Set CODEMATCH_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy

networks:
  edge:
  data:
    internal: true

volumes:
  postgres_data:
  private_cvs:
  caddy_data:
  caddy_config:
