services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codematch}
      POSTGRES_USER: ${POSTGRES_USER:-codematch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codematch} -d ${POSTGRES_DB:-codematch}"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-codematch}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-codematch}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
      CODEMATCH_CV_STORAGE_DIR: /var/lib/codematch/private-cvs
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - private_cvs:/var/lib/codematch/private-cvs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
  private_cvs:
